<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web MCP - Declarative API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    section { padding: 24px; border: 1px solid #e0e0e0; border-radius: 8px; }
    h2 { font-size: 1.1rem; margin-bottom: 16px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 4px; color: #555; }
    input, select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; margin-bottom: 12px; }
    button { padding: 8px 20px; background: #4f46e5; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>

  <h1>Web MCP - Declarative API</h1>

  <section>
    <h2>Add Todo</h2>
    <form id="addTodoForm"
          toolname="add_todo"
          tooldescription="Add a new todo item to the list">

      <label for="text">Todo text</label>
      <input type="text"
             id="text"
             name="text"
             placeholder="e.g. Buy groceries"
             required
             toolparamdescription="The content of the todo item to add" />

      <label for="priority">Priority</label>
      <select id="priority"
              name="priority"
              toolparamdescription="Priority level: low, medium, or high">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Add Todo</button>
    </form>
  </section>

</body>
</html>
